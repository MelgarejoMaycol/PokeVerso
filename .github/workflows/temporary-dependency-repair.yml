name: Temporary dependency repair
on:
  push:
    branches:
      - maintenance/rebuild-npm-lock-20261021
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'automated dependency lockfile repair')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit regenerated dependency files to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "automated dependency lockfile repair"
            git push origin HEAD:maintenance/rebuild-npm-lock-20261021
          fi
